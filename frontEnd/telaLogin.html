<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Importando o arquivo styleLogin.css atualizado -->
    <link rel="stylesheet" href="../css/styleLogin.css">
</head>
<body>

    <div class="login-container">
        <h1 class="title">Login</h1>
        <p class="subtitle">Preencha seus dados para entrar.</p>

        <form class="login-form">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="voce@exemplo.com" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" required>
            </div>

            <div class="forgot-password">
                <a href="#">Esqueceu sua senha?</a>
            </div>

            <button type="submit" class="btn-submit">Entrar</button>

            <p class="signup-text">
                Ainda não tem uma conta? <a href="#">Criar conta</a>
            </p>
        </form>
    </div>

</body>
</html>
