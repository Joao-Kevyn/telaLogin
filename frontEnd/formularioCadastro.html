<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta</title>
    <!-- Importando o styleCadastro.css -->
    <link rel="stylesheet" href="../css/styleCadastro.css">
</head>
<body>

    <div class="login-container">
        <h1 class="title">Criar Conta</h1>
        <p class="subtitle">Preencha os dados abaixo para se cadastrar.</p>

        <form class="login-form">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" placeholder="Seu nome completo" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="voce@exemplo.com" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Crie uma senha forte" required>
            </div>

            <div class="form-group">
                <label for="confirma-senha">Confirmar Senha</label>
                <input type="password" id="confirma-senha" placeholder="Repita a senha" required>
            </div>

            <!-- Botão Cadastrar linkado provisoriamente para a Home -->
            <a href="telaHome.html" class="btn-submit" style="display: block; text-align: center; text-decoration: none; line-height: normal; box-sizing: border-box;">Cadastrar</a>

            <p class="signup-text">
                Já tem uma conta? <a href="telaLogin.html">Entrar</a>
            </p>
        </form>
    </div>

</body>
</html>
